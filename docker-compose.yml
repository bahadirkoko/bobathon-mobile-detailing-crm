version: "3.9"
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: mobile_detailing_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mobile_detailing_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
