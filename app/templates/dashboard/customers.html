{% extends "base.html" %}

{% block title %}Customers{% endblock %}

{% block content %}
<section class="grid grid-2">
  <div class="card">
    <h2>Create Customer</h2>
    <form hx-post="/dashboard/customers" hx-target="#customer-list" hx-swap="outerHTML">
      <input type="text" name="first_name" placeholder="First name" required />
      <input type="text" name="last_name" placeholder="Last name" required />
      <input type="text" name="phone" placeholder="Phone" required />
      <input type="email" name="email" placeholder="Email optional" />
      <input type="text" name="default_street_address" placeholder="Street address" required />
      <input type="text" name="default_city" placeholder="City" required />
      <input type="text" name="default_state" placeholder="State" required />
      <input type="text" name="default_zipcode" placeholder="Zip code" required />
      <button type="submit">Save Customer</button>
    </form>
  </div>
  <div class="card">
    <h2>Search/Edit Customers</h2>
    <p class="muted">For the demo, edit directly in the list below.</p>
  </div>
</section>
{% include "dashboard/partials/customer_list.html" %}
{% endblock %}
