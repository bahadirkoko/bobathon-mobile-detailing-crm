<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Mobile Detailing CRM{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fb; color: #1f2937; }
      header { background: #111827; color: white; padding: 1rem 1.5rem; }
      nav a { color: white; margin-right: 1rem; text-decoration: none; }
      main { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
      .grid { display: grid; gap: 1rem; }
      .grid-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
      .card { background: white; border-radius: 12px; padding: 1rem; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
      .table { width: 100%; border-collapse: collapse; }
      .table th, .table td { border-bottom: 1px solid #e5e7eb; padding: 0.75rem; text-align: left; }
      form { display: grid; gap: 0.75rem; }
      input, select, button, textarea { padding: 0.65rem; border-radius: 8px; border: 1px solid #cbd5e1; }
      button { background: #2563eb; color: white; cursor: pointer; border: none; }
      .status-completed { color: #047857; font-weight: bold; }
      .status-in_progress { color: #b45309; font-weight: bold; }
      .muted { color: #6b7280; }
      .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      .photo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
      img { max-width: 100%; border-radius: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Mobile Detailing CRM</h1>
      <nav>
        <a href="/login">Login</a>
        <a href="/">Booking</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/dashboard/appointments">Appointments</a>
        <a href="/dashboard/customers">Customers</a>
        <a href="/dashboard/packages">Packages</a>
        <a href="/dashboard/employees">Employees</a>
        <a href="/logout">Logout</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
